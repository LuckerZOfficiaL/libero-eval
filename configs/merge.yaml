# Merge experiment config. Edit, then launch:  bash sweep/run.sh --config configs/merge.yaml

# --- what to MERGE (pick pairs OR scope) ---
pairs: "1:2"          # pairwise merge task1 + task2.  Multiple: "1:2,3:4,5:6"
# scope: 5            # alternative: first N disjoint pairs (0:1,2:3,...), or 'all' (38 pairs)

# --- how to MERGE ---
method: [task_arithmetic, ties, average]     # one method, OR a list to sweep: [task_arithmetic, ties, average]
                            # pairs x methods is a cross product (each combo = one job / result file)

# Method-specific hyperparameters. Only the block for the chosen `method` is used; the others are
# ignored, so you can keep them all here and just flip `method`. Defaults are shown — omit a key to
# use its default. Non-default values get appended to the result file name (e.g. task_1_2_ties_density0.3).
params:
  task_arithmetic:
    lambda: 1             # scaling of the summed task deltas (ΔW = λ · Σ ΔWᵢ)
  average: {}               # (no hyperparameters)
  ties:
    density: 0.2            # fraction of each task's delta kept (top-|weight| per module)
    lambda: 1.0             # scaling of the merged delta

# --- what to EVALUATE on ---
eval_tasks: auto            # 'auto' = the tasks being merged (in-distribution retention)
# eval_tasks: [3, 4]                                  # task indices -> their scenes (held-out transfer)
# eval_tasks: ["KITCHEN_SCENE7_open_the_microwave"]   # explicit LIBERO scene name(s)

# --- run settings ---
trials: 10                  # rollouts per (pair, scene) eval
workers: 2                  # parallel workers (2 = one server per P6000; use 4 for the full set)
