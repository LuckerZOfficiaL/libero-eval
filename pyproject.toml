[project]
name = "libero-eval"
version = "0.1.0"
description = "Minimal OpenPI-based LIBERO MuJoCo evaluation repo"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dm-tree>=0.1.8",
    "einops>=0.8.0",
    "etils>=1.3.0",
    "filelock>=3.16.1",
    "fsspec[gcs]>=2024.6.0",
    "imageio[ffmpeg]>=2.35.1",
    "matplotlib==3.5.3",
    "msgpack>=1.0.5",
    "mujoco==3.2.3",
    "numpydantic>=1.6.6",
    "numpy>=1.26,<2.0",
    "opencv-python==4.6.0.66",
    "peft>=0.17.0",
    "pillow>=10.4.0",
    "pynput==1.7.7",
    "pydantic>=2.10.0",
    "PyYAML>=6.0.2",
    "robosuite==1.4.1",
    "safetensors>=0.6.2",
    "sentencepiece>=0.2.0",
    "torch==2.7.1",
    "tqdm>=4.67.1",
    "tqdm-loggable>=0.2",
    "transformers==4.53.2",
    "tyro>=0.9.5",
    "typing-extensions>=4.12.2",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openpi", "src/openpi_client"]
